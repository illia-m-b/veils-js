---
# yamllint disable rule:line-length
glob_matcher: doublestar
pre-commit:
  commands:
    lint-ts-fix:
      glob: '**/*.{js,ts,cjs,mjs}'
      run: pnpm eslint --fix --no-warn-ignored --concurrency=auto {staged_files}
      stage_fixed: true
    fix-pkg:
      glob: 'package.json'
      run: pnpm pkg fix
      stage_fixed: true
    format-pkg:
      glob: 'package.json'
      run: pnpm sort-package-json {staged_files}
      stage_fixed: true
    format-code:
      glob: '**/*.{js,ts,cjs,mjs,json,jsonc,md,yml,yaml}'
      run: pnpm prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    lint-agents:
      glob: 'AGENTS.md'
      run: pnpm lint:agents
pre-push:
  parallel: true
  commands:
    lint-pkg:
      run: pnpm lint:pkg
    format-pkg-check:
      run: pnpm format:pkg:check
    type-check:
      run: pnpm types:check
    format-code-check:
      run: pnpm format:code:check
    lint-ts:
      run: pnpm lint:ts
    test:
      run: pnpm test
