---
# yamllint disable rule:line-length
name: actionlint
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  actionlint:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1.73.2
