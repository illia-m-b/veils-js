---
# yamllint disable rule:line-length
name: pnpm
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pnpm:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
          runtime: node@24.21.0
      - run: pnpm format:pkg:check
      - run: pnpm lint:pkg
      - run: pnpm format:code:check
      - run: pnpm types:check
      - run: pnpm lint:ts
  tests:
    needs:
      - pnpm
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          require-lockfile: true
          runtime: node@${{ matrix.node }}
      - run: pnpm test
